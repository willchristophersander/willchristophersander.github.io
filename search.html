<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Search | Will Christopher Sander</title>
    <meta name="description" content="Search this site." />
    <link rel="stylesheet" href="assets/css/style.css?v=20260206" />
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <a class="logo" href="index.html">Will Christopher Sander</a>
        <nav class="site-nav" aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="projects.html">Projects</a>
          <a href="code-reviews.html">Code Reviews</a>
          <a href="coursework.html">Coursework</a>
          <a href="experience.html">Experience</a>
          <a href="contact.html">Contact</a>
          <a href="resume.html">Resume</a>
        </nav>
        <form class="header-search" role="search" aria-label="Site search" action="search.html" method="get">
          <input type="search" name="q" placeholder="Search…" autocomplete="off" id="search-input" />
        </form>
      </div>
    </header>

    <main>
      <section class="page-hero">
        <div class="container">
          <h1>Search</h1>
          <p class="lede">Find pages that mention your search term.</p>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <form class="search-form-inline" action="search.html" method="get" style="margin-bottom: 1.5rem;">
            <input type="search" name="q" placeholder="e.g. C++, Python, William" autocomplete="off" id="search-inline" style="max-width: 20rem; padding: 0.5rem 0.75rem; font-size: 1rem; border: 1px solid var(--border); border-radius: 8px;" />
            <button type="submit" class="button" style="margin-left: 0.5rem;">Search</button>
          </form>
          <div id="search-results" class="muted-text" aria-live="polite">
            Loading…
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <span>© 2026 Will Christopher Sander</span>
        <span>Built for clarity and focus.</span>
      </div>
    </footer>

    <script src="assets/js/hash-scroll.js" defer></script>
    <script>
      (function () {
        var resultsEl = document.getElementById("search-results");
        if (!resultsEl) return;

        var params = new URLSearchParams(window.location.search);
        var q = params.get("q");
        if (q !== null) q = q.trim();
        if (!q) {
          resultsEl.textContent = "Enter a search term above and press Search.";
          var inp = document.getElementById("search-input");
          var inl = document.getElementById("search-inline");
          if (inp) inp.value = "";
          if (inl) inl.value = "";
          return;
        }

        var inp = document.getElementById("search-input");
        var inl = document.getElementById("search-inline");
        if (inp) inp.value = q;
        if (inl) inl.value = q;

        resultsEl.textContent = "Searching…";

        var indexUrl = "assets/search-index.json";
        fetch(indexUrl)
          .then(function (res) {
            if (!res.ok) throw new Error("Not found");
            return res.json();
          })
          .then(function (index) {
            if (!Array.isArray(index)) throw new Error("Invalid index");
            var lower = q.toLowerCase();
            var matches = [];
            for (var i = 0; i < index.length; i++) {
              var page = index[i];
              var text = page && page.text;
              if (text && String(text).toLowerCase().indexOf(lower) !== -1) {
                matches.push(page);
              }
            }
            matches = dedupeBySubtitle(matches);
            if (matches.length === 0) {
              resultsEl.innerHTML = "<p>No pages found for \"" + escapeHtml(q) + "\".</p>";
              return;
            }
            var html = "<p>" + matches.length + " result" + (matches.length === 1 ? "" : "s") + " found.</p><ul class=\"search-results-list\">";
            for (var j = 0; j < matches.length; j++) {
              var p = matches[j];
              var label = p.subtitle ? escapeHtml(p.title) + " \u2192 " + escapeHtml(p.subtitle) : escapeHtml(p.title);
              html += "<li><a href=\"" + escapeAttr(p.url) + "\">" + label + "</a></li>";
            }
            html += "</ul>";
            resultsEl.innerHTML = html;
            resultsEl.className = "muted-text";
          })
          .catch(function (err) {
            resultsEl.textContent = "Could not load search index. Run \"npm run build-search\" and ensure assets/search-index.json exists.";
          });

        function dedupeBySubtitle(list) {
          var keyToBest = {};
          for (var i = 0; i < list.length; i++) {
            var p = list[i];
            var key = (p.title || "") + "\n" + (p.subtitle || "");
            var existing = keyToBest[key];
            if (!existing || (p.url.indexOf("#") !== -1 && existing.url.indexOf("#") === -1)) {
              keyToBest[key] = p;
            }
          }
          return Object.keys(keyToBest).map(function (k) { return keyToBest[k]; });
        }
        function escapeHtml(str) {
          if (str == null) return "";
          var div = document.createElement("div");
          div.textContent = str;
          return div.innerHTML;
        }
        function escapeAttr(str) {
          if (str == null) return "";
          return String(str)
            .replace(/&/g, "&amp;")
            .replace(/"/g, "&quot;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
        }
      })();
    </script>
  </body>
</html>
